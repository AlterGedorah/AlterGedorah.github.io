<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riel</title>
    <link rel="icon" href="images/Logo.png" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid bg">
      <div class="col-12 mt-3" id="projects">
        <div
          class="card p-4 panels h-100 rounded-4 d-flex align-items-center justify-content-center"
        >
          <h4 class="m-0">Activities</h4>
        </div>
      </div>

      <div class="col-12 mb-3">
        <div
          id="projectCarousel"
          class="carousel slide"
          data-bs-ride="carousel"
        >
          <div class="carousel-inner">
            <div class="carousel-item active">
              <div class="row g-4">
                <div class="col-12 col-md-4">
                  <div class="proj-card h-100">
                    <div class="proj-card-img">
                      <img
                        src="../images/bentoact1.png"
                        class="modal-img-trigger w-100 h-100 object-fit-cover"
                        alt="Bento Layout"
                      />
                    </div>
                    <div class="proj-card-body">
                      <h5 class="proj-card-title">Iskonek</h5>
                      <p class="proj-card-desc">
                        A fan website for the film Project Hail Mary, applying Bootstrap and the Bento layout.
                      </p>
                      <div class="proj-card-footer">
                        <a href="https://altergedorah.github.io/web-development/bento/" target="_blank" class="proj-btn">View</a>
                      </div>
                    </div>
                  </div>
                </div>
                
                
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-center mt-4">
            <button
              class="btn btn-outline-secondary me-2"
              type="button"
              data-bs-target="#projectCarousel"
              data-bs-slide="prev"
            >
              <span aria-hidden="true">&laquo; Previous</span>
            </button>
            <button
              class="btn btn-outline-secondary"
              type="button"
              data-bs-target="#projectCarousel"
              data-bs-slide="next"
            >
              <span aria-hidden="true">Next &raquo;</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const imgModal = new bootstrap.Modal("#imageModal");
      document.querySelectorAll(".modal-img-trigger").forEach((img) => {
        img.style.cursor = "zoom-in";
        img.onclick = () => {
          document.getElementById("modalImage").src = img.src;
          imgModal.show();
        };
      });
      document.getElementById("toggle-btn").onclick = () => {
        const nav = document.getElementById("side-nav");
        nav.classList.toggle("d-flex");
        nav.classList.toggle("d-none");
      };
    </script>
  </body>
</html>
